name: pr-test-build

on:
  pull_request:
    # PRs opened against main are automatically retargeted to dev by this repo.
    # The edited event reruns validation against the actual dev merge base.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test-build:
    name: Go test and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate checked-in model catalogs
        run: |
          go run ./cmd/validate_codex_models --file internal/registry/models/codex_client_models.json
          git diff --exit-code -- internal/registry/models
      - name: Run Go tests
        run: go test ./...
      - name: Build production server
        run: go build -o test-output ./cmd/server
      - name: Remove build output
        if: always()
        run: rm -f test-output
