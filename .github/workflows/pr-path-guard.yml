name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when restricted paths change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- internal/translator; then
            exit 0
          fi
          # Fork upstream syncs carry upstream's own translator changes; allow them
          # only when internal/translator is identical to the nearest upstream release.
          git fetch --quiet --tags https://github.com/router-for-me/CLIProxyAPI.git
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          if git diff --quiet "$tag" HEAD -- internal/translator; then
            echo "internal/translator matches upstream $tag."
            exit 0
          fi
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "You need to create an issue for our maintenance team to make the necessary changes."
          exit 1
